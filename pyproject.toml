[build-system]
requires = ["scikit-build-core>=0.12", "cffi>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pylongfellow"
version = "0.4.0"
description = "Python binding for the Longfellow zero-knowledge mdoc scheme, over C++ and Rust backends"
readme = "README.md"
requires-python = ">=3.11"
# Composite expression: the wheel carries our Apache-2.0 code plus the compiled
# MPL-2.0 zk-cred-longfellow cdylib. MPL is file-level copyleft; the vendored
# files are unmodified at a pinned upstream SHA and their full source ships in
# the sdist. See the README's Licensing section.
license = "Apache-2.0 AND MPL-2.0"
license-files = [
  "LICENSE",
  "vendor/longfellow-zk/LICENSE",
  "vendor/zk-cred-longfellow/LICENSE",
]
authors = [{ name = "Nathan Schepers" }]
keywords = ["zero-knowledge", "mdoc", "longfellow", "eudi", "iso18013-5", "cffi"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security :: Cryptography",
]
# cffi API-mode extensions import _cffi_backend at runtime, so cffi is a real
# runtime dependency (as for cryptography, bcrypt, PyNaCl). cryptography and
# cbor2 carry mdoc.create_credential and its companions. zstandard decompresses
# the isrg-rust backend's circuit blobs; both backends ship in the default
# install, so it is a plain runtime dependency.
dependencies = ["cffi>=2.0", "cbor2>=6", "cryptography>=49", "zstandard"]

[project.urls]
Homepage = "https://github.com/pipe23-org/pylongfellow"
Documentation = "https://pylongfellow.readthedocs.io/en/stable/"
Repository = "https://github.com/pipe23-org/pylongfellow"
Issues = "https://github.com/pipe23-org/pylongfellow/issues"
Upstream = "https://github.com/google/longfellow-zk"

# Test/dev only — not shipped in the wheel.
[dependency-groups]
test = ["pytest>=8"]
docs = ["mkdocs-material", "mkdocstrings[python]", "interrogate"]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "ruff",
    "mypy",
    "types-cffi>=2.0.0.20260518",
    "pytest-cov>=7.1.0",
]

# No build.targets: the default target covers whichever backends the
# PYLONGFELLOW_BUILD_* switches leave on (naming a switched-off target would
# fail the build).
[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/pylongfellow"]
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
# Internal upstream object libs (ec/algebra/...) aren't PIC by default; the
# extension links them into one shared object, so force PIC globally.
CMAKE_POSITION_INDEPENDENT_CODE = "ON"
CMAKE_BUILD_TYPE = "Release"

# Fast suite by default; the one real circuit-gen test is marked `slow` and
# excluded. Run it with `-m slow`, or everything with `-m "slow or not slow"`.
[tool.pytest.ini_options]
markers = ["slow: real circuit generation (~15s); excluded by default, run with -m slow"]
# -rsxX: the untestable-cell census is a per-run report, so skips print too.
addopts = "-m 'not slow' -rsxX"

# Branch coverage, gated at 100%. The gate is only reachable with the slow test
# run (generate_circuit's path is slow-only): `pytest -m "slow or not slow" --cov`.
[tool.coverage.run]
branch = true
source = ["pylongfellow"]
# _ffibuild.py runs inside the CMake build (emits the extension C source), not
# under pytest — exclude it so coverage reflects the runtime package. The
# _zk_cred bindings are generated (never committed) and load a native library.
omit = ["*/_ffibuild.py", "*/backends/_zk_cred/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# Lint + format, line length 100. vendor/ (upstream submodule) is not ours to lint.
[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["vendor", "src/pylongfellow/backends/_zk_cred"]

# Closed list via `select`, never `extend-select`: a ruff upgrade must not change
# which rules run. E4/E7/E9 + F are ruff's 0.15 defaults; the families beyond them:
# I=imports, UP=pyupgrade, B=bugbear, S=bandit (security), RUF=ruff-native,
# SIM=simplify, C4=comprehensions, PT=pytest-style, PERF=perf, D=pydocstyle.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "RUF", "SIM", "C4", "PT", "PERF", "D"]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]
"scripts/*" = ["D", "S603"]
"src/_cffi_src/*" = ["D"]

# Strict over the package and tests (scripts/ excluded; see override below).
# python_version is the support floor, so mypy flags any newer-only feature.
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pylongfellow", "src/_cffi_src", "tests"]
exclude = ["src/pylongfellow/backends/_zk_cred"]

# The generated bindings are untyped and not always built; isrg_rust.py imports them lazily.
[[tool.mypy.overrides]]
module = "pylongfellow.backends._zk_cred.*"
ignore_missing_imports = true

# Tests are checked for real errors but not required to annotate every function;
# scripts/ stay out of the check (not in `files`).
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-private = true
ignore-semiprivate = true
ignore-magic = true
ignore-nested-functions = true
exclude = ["tests", "scripts", "scratch", "src/_cffi_src", "build", "vendor", "src/pylongfellow/backends/_zk_cred"]

# before-all installs gtest + benchmark because upstream's CMake REQUIREs them
# at configure time, even though we build only the library, and rustup because
# the isrg-rust cdylib builds inside the same container. The four CPython
# passes share the container, so cargo builds cold once per libc family and is
# incremental for the rest.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
build-frontend = "build[uv]"
build-verbosity = 1
test-groups = ["test"]
# The require-backends variable turns absent-backend skips into failures: the
# wheel under test must carry both backends (tests/test_required_backends.py).
test-command = 'PYLONGFELLOW_REQUIRE_BACKENDS=google-cpp,isrg-rust pytest {project}/tests -m "slow or not slow"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y epel-release && dnf install -y openssl-devel libzstd-devel gtest-devel google-benchmark-devel && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"

# musllinux is Alpine — override the dnf before-all with apk. rustup installs
# the musl host toolchain there. The musl target defaults to a static CRT,
# under which rustc drops the cdylib crate type and cargo builds no .so;
# -crt-static restores dynamic musl linking, which is what musllinux wheels
# link against anyway.
[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "apk add --no-cache curl openssl-dev zstd-dev gtest-dev benchmark-dev && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { RUSTFLAGS = "-C target-feature=-crt-static" }
