[build-system]
requires = ["scikit-build-core>=0.12", "cffi>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pylongfellow"
version = "0.7.0"
description = "Python interface to implementations of Longfellow zero-knowledge proofs over ISO 18013-5 mdoc credentials"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND MPL-2.0"
license-files = [
  "LICENSE",
  "vendor/longfellow-zk/LICENSE",
  "vendor/zk-cred-longfellow/LICENSE",
]
authors = [{ name = "Nathan Schepers" }]
keywords = ["zero-knowledge", "mdoc", "longfellow", "eudi", "iso18013-5", "cffi"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cffi>=2.0", "cbor2>=6", "cryptography>=49", "zstandard"]

[project.urls]
Homepage = "https://github.com/pipe23-org/pylongfellow"
Documentation = "https://pylongfellow.readthedocs.io/en/stable/"
Repository = "https://github.com/pipe23-org/pylongfellow"
Issues = "https://github.com/pipe23-org/pylongfellow/issues"
Upstream = "https://github.com/google/longfellow-zk"

[dependency-groups]
test = [
    "longfellow-vectors>=0.1.0",
    "pytest>=8",
]
docs = ["mkdocs-material", "mkdocstrings[python]", "interrogate"]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "ruff",
    "mypy",
    "types-cffi>=2.0.0.20260518",
    "pytest-cov>=7.1.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/pylongfellow"]
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
CMAKE_POSITION_INDEPENDENT_CODE = "ON"
CMAKE_BUILD_TYPE = "Release"

[tool.pytest.ini_options]
markers = [
  "slow: real circuit generation (~15s) and isrg-rust cases; excluded by default, run with -m slow",
]
addopts = "-m 'not slow' -rsxX"

[tool.coverage.run]
branch = true
source = ["pylongfellow"]
omit = ["*/ffibuild.py", "*/backends/_zk_cred/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["vendor", "src/pylongfellow/backends/_zk_cred"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "RUF", "SIM", "C4", "PT", "PERF", "D"]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]
"scripts/*" = ["D", "S603"]
"native/*" = ["D", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pylongfellow", "native", "tests"]
exclude = ["src/pylongfellow/backends/_zk_cred"]

[[tool.mypy.overrides]]
module = "pylongfellow.backends._zk_cred.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-private = true
ignore-semiprivate = true
ignore-magic = true
ignore-nested-functions = true
exclude = ["tests", "scripts", "scratch", "native", "build", "vendor", "src/pylongfellow/backends/_zk_cred"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
build-frontend = "build[uv]"
build-verbosity = 1
test-groups = ["test"]
test-command = 'PYLONGFELLOW_REQUIRE_BACKENDS=google-cpp,isrg-rust pytest {project}/tests -m "slow or not slow"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y epel-release && dnf install -y openssl-devel libzstd-devel gtest-devel google-benchmark-devel && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "apk add --no-cache curl openssl-dev zstd-dev gtest-dev benchmark-dev && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { RUSTFLAGS = "-C target-feature=-crt-static" }
