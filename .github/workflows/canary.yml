name: canary

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Record release pins
        id: pin
        shell: bash
        run: |
          echo "goog=$(git -C vendor/longfellow-zk rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "isrg=$(git -C vendor/zk-cred-longfellow rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out both upstreams at HEAD
        id: heads
        shell: bash
        run: |
          for dir in vendor/longfellow-zk vendor/zk-cred-longfellow; do
            git -C "$dir" fetch origin
            git -C "$dir" remote set-head origin --auto
            git -C "$dir" checkout origin/HEAD
          done
          {
            echo "goog=$(git -C vendor/longfellow-zk rev-parse HEAD)"
            echo "isrg=$(git -C vendor/zk-cred-longfellow rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Fingerprint watched paths
        id: fp
        shell: bash
        run: |
          google_cpp_fp=$(git -C vendor/longfellow-zk rev-parse HEAD:lib | sha256sum | cut -c1-12)
          isrg_rust_fp=$(git -C vendor/zk-cred-longfellow rev-parse HEAD:src HEAD:Cargo.toml HEAD:Cargo.lock | sha256sum | cut -c1-12)
          self_fp=$(git rev-parse HEAD:src HEAD:tests HEAD:native HEAD:pyproject.toml HEAD:uv.lock HEAD:.github/workflows/canary.yml | sha256sum | cut -c1-12)
          combined=$(echo "$google_cpp_fp $isrg_rust_fp $self_fp" | sha256sum | cut -c1-16)
          {
            echo "google_cpp_fp=$google_cpp_fp"
            echo "isrg_rust_fp=$isrg_rust_fp"
            echo "self_fp=$self_fp"
            echo "combined=$combined"
            echo "self=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Restore tested state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: canary-tested.txt
          key: canary-tested-${{ steps.fp.outputs.combined }}
          restore-keys: canary-tested-

      - name: Previous tested state
        id: prev
        shell: bash
        run: |
          goog=""
          isrg=""
          if [ -f canary-tested.txt ]; then
            goog=$(sed -n 's/^goog=//p' canary-tested.txt)
            isrg=$(sed -n 's/^isrg=//p' canary-tested.txt)
          fi
          {
            echo "goog=$goog"
            echo "isrg=$isrg"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to run
        id: gate
        if: github.event_name == 'workflow_dispatch' || steps.state.outputs.cache-hit != 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      - name: State already tested
        if: steps.gate.outputs.run != 'true'
        run: echo "Fingerprint ${{ steps.fp.outputs.combined }} was already tested; skipping build and suite."

      - name: Install build dependencies
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libzstd-dev libgtest-dev libbenchmark-dev

      - uses: hendrikmuhs/ccache-action@v1
        if: steps.gate.outputs.run == 'true'
        with:
          key: canary

      - uses: astral-sh/setup-uv@v9.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.14"

      - name: Build google backend
        if: steps.gate.outputs.run == 'true'
        run: uv sync --locked

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'
        with:
          workspaces: vendor/zk-cred-longfellow
          shared-key: zk-cred

      - name: Build ISRG backend
        if: steps.gate.outputs.run == 'true'
        run: uv run --no-sync python native/isrg-rust/build.py

      - name: Differential suite
        id: suite
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: uv run --no-sync pytest tests -m "slow or not slow" | tee pytest-output.txt

      - name: Record tested state
        if: always() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure')
        shell: bash
        run: |
          {
            echo "goog=${{ steps.heads.outputs.goog }}"
            echo "isrg=${{ steps.heads.outputs.isrg }}"
            echo "self=$GITHUB_SHA"
          } > canary-tested.txt

      - name: Save tested state
        if: always() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          path: canary-tested.txt
          key: canary-tested-${{ steps.fp.outputs.combined }}

      - name: Report drift
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.suite.outcome }}" = "failure" ]; then
            phase=test
          else
            phase=build
          fi
          {
            echo "## Canary drift — $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "Revisions under test:"
            echo
            echo "- google/longfellow-zk \`${{ steps.heads.outputs.goog || 'unavailable' }}\` — watched paths (\`lib/\`) \`${{ steps.fp.outputs.google_cpp_fp || 'unavailable' }}\`"
            echo "- abetterinternet/zk-cred-longfellow \`${{ steps.heads.outputs.isrg || 'unavailable' }}\` — watched paths (\`src\`, \`Cargo.toml\`, \`Cargo.lock\`) \`${{ steps.fp.outputs.isrg_rust_fp || 'unavailable' }}\`"
            echo "- ${GITHUB_REPOSITORY} \`${{ steps.fp.outputs.self || 'unavailable' }}\` — watched paths (\`src\`, \`tests\`, \`native\`, \`pyproject.toml\`, \`uv.lock\`, \`canary.yml\`) \`${{ steps.fp.outputs.self_fp || 'unavailable' }}\`"
            echo
            echo "Failed phase: \`$phase\`"
            echo
            if [ -n "${{ steps.prev.outputs.goog }}" ] && [ -n "${{ steps.heads.outputs.goog }}" ] && [ "${{ steps.prev.outputs.goog }}" != "${{ steps.heads.outputs.goog }}" ]; then
              echo "Moved since the last tested state — google/longfellow-zk: [compare](https://github.com/google/longfellow-zk/compare/${{ steps.prev.outputs.goog }}...${{ steps.heads.outputs.goog }})"
            fi
            if [ -n "${{ steps.prev.outputs.isrg }}" ] && [ -n "${{ steps.heads.outputs.isrg }}" ] && [ "${{ steps.prev.outputs.isrg }}" != "${{ steps.heads.outputs.isrg }}" ]; then
              echo "Moved since the last tested state — abetterinternet/zk-cred-longfellow: [compare](https://github.com/abetterinternet/zk-cred-longfellow/compare/${{ steps.prev.outputs.isrg }}...${{ steps.heads.outputs.isrg }})"
            fi
            echo
            echo "Release pins: google/longfellow-zk \`${{ steps.pin.outputs.goog }}\`, zk-cred-longfellow \`${{ steps.pin.outputs.isrg }}\`. The HEADs under test are not what released wheels build from."
            echo
            echo '```'
            tail -n 40 pytest-output.txt 2>/dev/null || echo "(no pytest output; failed during build)"
            echo '```'
          } > comment.md
          gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Report run
        if: success() && steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summary=$(grep -E '^=+.*(passed|failed|error).*=+$' pytest-output.txt | tail -n 1 || true)
          observations=$(grep 'observation:' pytest-output.txt || true)
          {
            echo "## Canary run — $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "Revisions under test:"
            echo
            echo "- google/longfellow-zk \`${{ steps.heads.outputs.goog }}\` — watched paths (\`lib/\`) \`${{ steps.fp.outputs.google_cpp_fp }}\`"
            echo "- abetterinternet/zk-cred-longfellow \`${{ steps.heads.outputs.isrg }}\` — watched paths (\`src\`, \`Cargo.toml\`, \`Cargo.lock\`) \`${{ steps.fp.outputs.isrg_rust_fp }}\`"
            echo "- ${GITHUB_REPOSITORY} \`${{ steps.fp.outputs.self }}\` — watched paths (\`src\`, \`tests\`, \`native\`, \`pyproject.toml\`, \`uv.lock\`, \`canary.yml\`) \`${{ steps.fp.outputs.self_fp }}\`"
            echo
            if [ -n "${{ steps.prev.outputs.goog }}" ] && [ "${{ steps.prev.outputs.goog }}" != "${{ steps.heads.outputs.goog }}" ]; then
              echo "Moved since the last tested state — google/longfellow-zk: [compare](https://github.com/google/longfellow-zk/compare/${{ steps.prev.outputs.goog }}...${{ steps.heads.outputs.goog }})"
            fi
            if [ -n "${{ steps.prev.outputs.isrg }}" ] && [ "${{ steps.prev.outputs.isrg }}" != "${{ steps.heads.outputs.isrg }}" ]; then
              echo "Moved since the last tested state — abetterinternet/zk-cred-longfellow: [compare](https://github.com/abetterinternet/zk-cred-longfellow/compare/${{ steps.prev.outputs.isrg }}...${{ steps.heads.outputs.isrg }})"
            fi
            echo
            echo "Release pins: google/longfellow-zk \`${{ steps.pin.outputs.goog }}\`, zk-cred-longfellow \`${{ steps.pin.outputs.isrg }}\`. The HEADs under test are not what released wheels build from."
            echo
            echo "Both implementations of draft-google-cfrg-libzk at the revisions above agree on prove/verify across the committed corpus, and circuit regeneration reproduces the committed \`circuit_id\`s."
            echo
            echo '```'
            echo "$summary"
            echo '```'
            if [ -n "$observations" ]; then
              echo
              echo "### Observations"
              echo
              echo '```'
              echo "$observations"
              echo '```'
            fi
          } > run-comment.md
          gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body-file run-comment.md
