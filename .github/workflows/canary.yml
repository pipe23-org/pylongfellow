name: canary

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check out both upstreams at HEAD
        id: heads
        run: |
          for dir in vendor/longfellow-zk vendor/zk-cred-longfellow; do
            git -C "$dir" fetch origin
            git -C "$dir" remote set-head origin --auto
            git -C "$dir" checkout origin/HEAD
          done
          goog=$(git -C vendor/longfellow-zk rev-parse HEAD)
          isrg=$(git -C vendor/zk-cred-longfellow rev-parse HEAD)
          echo "goog=$goog" >> "$GITHUB_OUTPUT"
          echo "isrg=$isrg" >> "$GITHUB_OUTPUT"
          echo "google/longfellow-zk HEAD: $goog"
          echo "abetterinternet/zk-cred-longfellow HEAD: $isrg"

      - name: Skip-guard lookup
        id: guard
        uses: actions/cache/restore@v4
        with:
          path: .canary-marker
          key: canary-${{ steps.heads.outputs.goog }}-${{ steps.heads.outputs.isrg }}
          lookup-only: true

      - name: Upstream pair already run
        if: steps.guard.outputs.cache-hit == 'true'
        run: echo "Pair ${{ steps.heads.outputs.goog }} / ${{ steps.heads.outputs.isrg }} already run; skipping build and test."

      - name: Prepare skip-guard marker
        if: steps.guard.outputs.cache-hit != 'true'
        run: date -u > .canary-marker

      - name: Install build dependencies
        if: steps.guard.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libzstd-dev libgtest-dev libbenchmark-dev

      - uses: hendrikmuhs/ccache-action@v1
        if: steps.guard.outputs.cache-hit != 'true'
        with:
          key: canary

      - uses: astral-sh/setup-uv@v8.3.2
        if: steps.guard.outputs.cache-hit != 'true'
        with:
          python-version: "3.14"

      - name: Build google backend
        if: steps.guard.outputs.cache-hit != 'true'
        run: uv sync --locked

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.cache-hit != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.cache-hit != 'true'
        with:
          workspaces: vendor/zk-cred-longfellow
          shared-key: zk-cred

      - name: Build ISRG backend
        if: steps.guard.outputs.cache-hit != 'true'
        run: uv run --no-sync python scripts/build_isrg_rust_backend.py

      - name: Differential suite
        id: suite
        if: steps.guard.outputs.cache-hit != 'true'
        run: uv run --no-sync pytest -m "slow or not slow" | tee pytest-output.txt

      - name: Report drift
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.suite.outcome }}" = "failure" ]; then
            phase=test
          else
            phase=build
          fi
          {
            echo "## Canary drift — $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "- google/longfellow-zk: \`${{ steps.heads.outputs.goog }}\`"
            echo "- abetterinternet/zk-cred-longfellow: \`${{ steps.heads.outputs.isrg }}\`"
            echo "- Failed phase: \`$phase\`"
            echo
            echo '```'
            tail -n 40 pytest-output.txt 2>/dev/null || echo "(no pytest output; failed during build)"
            echo '```'
          } > comment.md
          gh issue comment 21 --repo pipe23-org/pylongfellow --body-file comment.md

      - name: Save skip-guard marker
        if: always() && steps.guard.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .canary-marker
          key: canary-${{ steps.heads.outputs.goog }}-${{ steps.heads.outputs.isrg }}
