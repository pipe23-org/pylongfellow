name: canary

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Record pinned bound surface
        id: pin
        shell: bash
        run: |
          goog_fp=$(git -C vendor/longfellow-zk rev-parse HEAD:lib | sha256sum | cut -c1-12)
          isrg_fp=$(git -C vendor/zk-cred-longfellow rev-parse HEAD:src HEAD:Cargo.toml HEAD:Cargo.lock | sha256sum | cut -c1-12)
          echo "goog_fp=$goog_fp" >> "$GITHUB_OUTPUT"
          echo "isrg_fp=$isrg_fp" >> "$GITHUB_OUTPUT"

      - name: Check out both upstreams at HEAD
        id: heads
        shell: bash
        run: |
          for dir in vendor/longfellow-zk vendor/zk-cred-longfellow; do
            git -C "$dir" fetch origin
            git -C "$dir" remote set-head origin --auto
            git -C "$dir" checkout origin/HEAD
          done
          goog=$(git -C vendor/longfellow-zk rev-parse HEAD)
          isrg=$(git -C vendor/zk-cred-longfellow rev-parse HEAD)
          goog_fp=$(git -C vendor/longfellow-zk rev-parse HEAD:lib | sha256sum | cut -c1-12)
          isrg_fp=$(git -C vendor/zk-cred-longfellow rev-parse HEAD:src HEAD:Cargo.toml HEAD:Cargo.lock | sha256sum | cut -c1-12)
          if [ "$goog_fp" = "${{ steps.pin.outputs.goog_fp }}" ]; then goog_delta=unchanged; else goog_delta=changed; fi
          if [ "$isrg_fp" = "${{ steps.pin.outputs.isrg_fp }}" ]; then isrg_delta=unchanged; else isrg_delta=changed; fi
          {
            echo "goog=$goog"
            echo "isrg=$isrg"
            echo "goog_fp=$goog_fp"
            echo "isrg_fp=$isrg_fp"
            echo "goog_delta=$goog_delta"
            echo "isrg_delta=$isrg_delta"
          } >> "$GITHUB_OUTPUT"
          echo "google/longfellow-zk HEAD: $goog (bound surface $goog_fp, $goog_delta since pin)"
          echo "abetterinternet/zk-cred-longfellow HEAD: $isrg (bound surface $isrg_fp, $isrg_delta since pin)"

      - name: Skip-guard lookup
        id: guard
        uses: actions/cache/restore@v4
        with:
          path: .canary-marker
          key: canary-tree-${{ steps.heads.outputs.goog_fp }}-${{ steps.heads.outputs.isrg_fp }}
          lookup-only: true

      - name: Upstream pair already run
        if: steps.guard.outputs.cache-hit == 'true'
        run: echo "Bound surface ${{ steps.heads.outputs.goog_fp }} / ${{ steps.heads.outputs.isrg_fp }} already run; skipping build and test."

      - name: Prepare skip-guard marker
        if: steps.guard.outputs.cache-hit != 'true'
        run: date -u > .canary-marker

      - name: Install build dependencies
        if: steps.guard.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libzstd-dev libgtest-dev libbenchmark-dev

      - uses: hendrikmuhs/ccache-action@v1
        if: steps.guard.outputs.cache-hit != 'true'
        with:
          key: canary

      - uses: astral-sh/setup-uv@v8.3.2
        if: steps.guard.outputs.cache-hit != 'true'
        with:
          python-version: "3.14"

      - name: Build google backend
        if: steps.guard.outputs.cache-hit != 'true'
        run: uv sync --locked

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.cache-hit != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.cache-hit != 'true'
        with:
          workspaces: vendor/zk-cred-longfellow
          shared-key: zk-cred

      - name: Build ISRG backend
        if: steps.guard.outputs.cache-hit != 'true'
        run: uv run --no-sync python scripts/build_isrg_rust_backend.py

      - name: Differential suite
        id: suite
        if: steps.guard.outputs.cache-hit != 'true'
        # Explicit bash so the step shell carries pipefail: the tee must not mask
        # pytest's exit status. Collection is scoped to tests/ because the unpinned
        # vendor trees may carry their own Python test files.
        shell: bash
        run: uv run --no-sync pytest tests -m "slow or not slow" | tee pytest-output.txt

      - name: Report drift
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.suite.outcome }}" = "failure" ]; then
            phase=test
          else
            phase=build
          fi
          {
            echo "## Canary drift — $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "- google/longfellow-zk: \`${{ steps.heads.outputs.goog || 'unavailable' }}\` (bound surface \`${{ steps.heads.outputs.goog_fp || 'unavailable' }}\`, ${{ steps.heads.outputs.goog_delta || 'unknown' }} since pin)"
            echo "- abetterinternet/zk-cred-longfellow: \`${{ steps.heads.outputs.isrg || 'unavailable' }}\` (bound surface \`${{ steps.heads.outputs.isrg_fp || 'unavailable' }}\`, ${{ steps.heads.outputs.isrg_delta || 'unknown' }} since pin)"
            echo "- Failed phase: \`$phase\`"
            echo
            echo '```'
            tail -n 40 pytest-output.txt 2>/dev/null || echo "(no pytest output; failed during build)"
            echo '```'
          } > comment.md
          gh issue comment 21 --repo pipe23-org/pylongfellow --body-file comment.md

      - name: Report run
        if: success() && steps.guard.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summary=$(grep -E '^=+.*(passed|failed|error).*=+$' pytest-output.txt | tail -n 1 || true)
          observations=$(grep 'observation:' pytest-output.txt || true)
          {
            echo "## Canary run — $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "- google/longfellow-zk: \`${{ steps.heads.outputs.goog || 'unavailable' }}\` (bound surface \`${{ steps.heads.outputs.goog_fp || 'unavailable' }}\`, ${{ steps.heads.outputs.goog_delta || 'unknown' }} since pin)"
            echo "- abetterinternet/zk-cred-longfellow: \`${{ steps.heads.outputs.isrg || 'unavailable' }}\` (bound surface \`${{ steps.heads.outputs.isrg_fp || 'unavailable' }}\`, ${{ steps.heads.outputs.isrg_delta || 'unknown' }} since pin)"
            echo
            echo "Green run. Suite summary:"
            echo
            echo '```'
            echo "$summary"
            echo '```'
            if [ -n "$observations" ]; then
              echo
              echo "### Observations"
              echo
              echo '```'
              echo "$observations"
              echo '```'
            fi
          } > run-comment.md
          gh issue comment 21 --repo pipe23-org/pylongfellow --body-file run-comment.md

      - name: Save skip-guard marker
        if: always() && steps.guard.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .canary-marker
          key: canary-tree-${{ steps.heads.outputs.goog_fp }}-${{ steps.heads.outputs.isrg_fp }}
